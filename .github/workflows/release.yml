name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build dashboard
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build router
        run: cargo build --release --locked --target ${{ matrix.target }} -p alnair-router

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: >-
          tar -czf "alnair-router-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          -C "target/${{ matrix.target }}/release" alnair-router

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "target/${{ matrix.target }}/release/alnair-router.exe"
          -DestinationPath "alnair-router-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: alnair-router-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    name: Publish image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker

  npm:
    name: Publish npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches manifests
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for dir in npm/alnair-router npm/alnair-router-darwin-arm64 npm/alnair-router-linux-x64 npm/alnair-router-win32-x64; do
            actual=$(node -p "require('./$dir/package.json').version")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir is at $actual but the tag is v$expected"
              exit 1
            fi
          done

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          mkdir -p npm/alnair-router-linux-x64/bin
          tar -xzf "dist/alnair-router-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C npm/alnair-router-linux-x64/bin
          chmod +x npm/alnair-router-linux-x64/bin/alnair-router

          mkdir -p npm/alnair-router-darwin-arm64/bin
          tar -xzf "dist/alnair-router-${tag}-aarch64-apple-darwin.tar.gz" -C npm/alnair-router-darwin-arm64/bin
          chmod +x npm/alnair-router-darwin-arm64/bin/alnair-router

          mkdir -p npm/alnair-router-win32-x64/bin
          unzip -o "dist/alnair-router-${tag}-x86_64-pc-windows-msvc.zip" -d npm/alnair-router-win32-x64/bin

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/alnair-router-linux-x64 npm/alnair-router-win32-x64 npm/alnair-router-darwin-arm64 npm/alnair-router; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi
            npm publish "./$dir" --provenance
          done

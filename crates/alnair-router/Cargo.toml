[package]
name = "alnair-router"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Standalone OpenAI-compatible AI router with prefixed model IDs and tiered fallback combos"
publish = false

[[bin]]
name = "alnair-router"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
alnair-llm = { path = "../alnair-llm" }
argon2 = "0.5"
async-stream = "0.3"
auto-launch = "0.5"
axum = { version = "0.8", features = ["macros", "json", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures = "0.3"
hex = "0.4"
http = "1.3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
rust-embed = "8"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "macros",
  "migrate",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1.18", features = ["serde", "v4"] }

[build-dependencies]
# Compiles the app icon and version block into the Windows executable; the
# build script only invokes it when the target OS is Windows.
winresource = { version = "0.1", default-features = false }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
ico = "0.5"
tao = "0.36"
tray-icon = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.23"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }

# alnair-router configuration.
# Copy to $ALNAIR_ROUTER_HOME/config.toml (default ~/.alnair-router/config.toml).
#
# Every value can be overridden by an environment variable using the
# ALNAIR_ROUTER__SECTION__KEY form, e.g.:
#   ALNAIR_ROUTER__SERVER__PORT=9000
#   ALNAIR_ROUTER__STORAGE__URL=sqlite:///var/lib/alnair-router/router.sqlite?mode=rwc
#
# The dashboard's Settings page can override a subset at runtime: server auth,
# readiness, CORS and LAN access, router.*, limits.*, rate_limit.*, and
# pricing.*. Overrides are stored in the database, hot-applied, and win over
# file/env values until reset.

[server]
# Port the router listens on.
port = 7878
# Interface to bind. Anything non-loopback needs an admin token (below).
host = "127.0.0.1"
# When false, /v1/* accepts requests without an Authorization header.
# Convenient for localhost development; set true for anything reachable.
require_api_key = false
# Bearer token for scripts and CI; the dashboard itself signs in with a
# password. Required when `host` is non-loopback unless the opt-out below is
# used. Prefer `lan_access = true` for LAN: it needs no token.
# admin_token = "change-me"
# Explicitly permit a non-loopback bind without an admin token. The admin API
# reads upstream credentials and mints client keys — only for trusted networks.
allow_unauthenticated_admin = false
# Include best-effort upstream TCP reachability in /api/ready.
readiness_upstream_checks = false
# Expose the self-service usage page (/me) and GET /api/public/usage, where a
# client reads its own rollup with a router-issued API key.
public_usage = true
# Keep an encrypted copy of every minted client key so the API Keys page can
# reveal it later. Turning this off restores the hash-only posture, where a key
# is readable only at creation time and can otherwise only be rotated. Keys
# minted before this was enabled have no recoverable secret.
store_key_secrets = true
# Bind every interface so the LAN can reach the router. The listener re-binds
# when this changes (Settings toggle), and admin routes then require the
# dashboard password. This file value is the boot default.
lan_access = false
# Serve the embedded dashboard at / (disable when a reverse proxy owns it).
serve_dashboard = true
# Show a system tray icon with "Open dashboard" and "Quit" while serving.
# Windows and macOS only; `alnair-router --no-tray` disables it for one run.
tray = true
# Extra origins permitted to call the API cross-origin. Empty (default) emits
# no CORS headers at all; the dashboard is served same-origin and needs none of
# this. Use ["*"] to allow any origin, or list explicit origins.
# cors_origins = ["https://admin.example.com"]

[storage]
# SQLite URL. Leave empty to use $ALNAIR_ROUTER_HOME/db/router.sqlite.
url = ""

[secrets]
# Optional. 32-byte key encrypting upstream credentials at rest, as 64 hex
# characters or base64. When unset, the router generates
# $ALNAIR_ROUTER_HOME/secrets.key on first run and reuses it.
# key = "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"

[router]
# Connection used for bare model names with no `prefix/` segment.
# Must match a connection name.
default_connection = "openai-main"
# Maximum number of fallback tiers attempted for a single request.
max_attempts = 5
# Provider retries inside a single tier before the executor moves to the next
# tier. A `Retry-After` response header always wins over the local delay.
max_retries_per_tier = 2
# Upper bound for the exponential retry delay (500 ms doubling per retry).
max_retry_delay_ms = 30000
# Routing-catalog cache TTL in milliseconds. Admin writes invalidate it
# immediately; 0 caches until the next write.
catalog_ttl_ms = 1000
# Default upstream connect/first-byte timeout in milliseconds (0 disables).
# Connections can override this.
connect_timeout_ms = 10000
# Default stream idle timeout in milliseconds (0 disables). Connections can
# override this.
idle_timeout_ms = 60000

[limits]
# Upstream concurrency caps. 0 disables the corresponding cap.
max_concurrent = 0
max_concurrent_per_connection = 0
# How long a request waits for a slot before failing with 429. 0 waits forever.
acquire_timeout_ms = 30000

[rate_limit]
# Default requests-per-minute allowed per client key. 0 is unlimited.
# Individual keys can override (or disable) this from the admin API / dashboard.
requests_per_minute = 0
# Token-bucket capacity for bursts. 0 uses one minute's worth of tokens.
burst = 0

[pricing]
# Crawl a public pricing catalog in the background (LiteLLM or models.dev
# payloads are both recognized). Dashboard overrides always win and survive
# syncs; crawled rows shadow the built-in rate table only.
sync_enabled = false
# Crawl interval in seconds (clamped to at least 60).
sync_interval_secs = 86400
source_url = "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"

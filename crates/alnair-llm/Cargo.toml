[package]
name = "alnair-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Vendored LLM provider stack (OpenAI-compatible + Anthropic-native) used by alnair-router"
publish = false

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
